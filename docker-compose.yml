services:
  postgres_db:
    image: postgres:16
    container_name: smart_ats_db
    environment:
      POSTGRES_USER: ats_user
      POSTGRES_PASSWORD: ats_password
      POSTGRES_DB: smart_ats_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smart_ats_net

  redis:
    image: redis:7-alpine
    container_name: smart_ats_redis
    ports:
      - "6379:6379"
    networks:
      - smart_ats_net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: smart_ats_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - smart_ats_net

  # تسک SAP-76: پشته نظارتی متمرکز لاگ‌ها (ELK Stack)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: smart_ats_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - smart_ats_net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: smart_ats_logstash
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "5000:5000/tcp"
      - "5000:5000/udp"
      - "5044:5044"
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - smart_ats_net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: smart_ats_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - smart_ats_net

volumes:
  postgres_data:
  qdrant_data:
  elasticsearch_data:

networks:
  smart_ats_net:
    driver: bridge
input {
  tcp {
    port => 5000
    codec => json_lines
  }
  udp {
    port => 5000
    codec => json
  }
  beats {
    port => 5044
  }
}

filter {
  if ![service] {
    mutate {
      add_field => { "service" => "smart-ats-backend" }
    }
  }
  if ![environment] {
    mutate {
      add_field => { "environment" => "production" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "smart-ats-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}